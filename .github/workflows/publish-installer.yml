name: Notify one-file installer pipeline

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify-installer:
    runs-on: ubuntu-latest
    env:
      INSTALLER_REPO_TOKEN: ${{ secrets.INSTALLER_REPO_TOKEN }}
    steps:
      - name: Dispatch installer build immediately
        if: env.INSTALLER_REPO_TOKEN != ''
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg url "$RELEASE_URL" \
            '{event_type:"studio_release", client_payload:{tag:$tag, release_url:$url}}' > dispatch.json
          GH_TOKEN="$INSTALLER_REPO_TOKEN" gh api --method POST \
            repos/atmarachchige0081/Tang-FPGA-Studio-Installer/dispatches \
            --input dispatch.json

      - name: Confirm token-free scheduled fallback
        if: env.INSTALLER_REPO_TOKEN == ''
        run: |
          echo "::notice::INSTALLER_REPO_TOKEN is not configured. The installer repository's hourly release poll will synchronize and publish this release automatically."
